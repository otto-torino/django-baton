name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Explicit pairs, so that a new Django release does not silently
        # replace the one tested before it.
        include:
          - {python-version: '3.10', django: '4.2'}
          - {python-version: '3.11', django: '5.2'}
          - {python-version: '3.12', django: '6.0'}
          - {python-version: '3.12', django: '6.1'}
    name: test (Python ${{ matrix.python-version }}, Django ${{ matrix.django }})
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install "Django~=${{ matrix.django }}.0"
        pip install -r testapp/test-requirements.txt
    # Fast feedback across Python/Django versions. The heavier Playwright e2e
    # suite runs in the separate `e2e` job below.
    - name: Run tests (non-e2e)
      working-directory: testapp/app
      run: python manage.py test app.tests.test_config app.tests.test_views app.tests.test_urls

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the admin markup changed in Django 6.1: run the browser on both sides
        django: ['6.0', '6.1']
    name: e2e (Django ${{ matrix.django }})
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install "Django~=${{ matrix.django }}.0"
        pip install -r testapp/test-requirements.txt -r testapp/requirements-e2e.txt
    - name: Install Playwright browser
      run: python -m playwright install --with-deps chromium
    - name: Run e2e tests (Playwright)
      working-directory: testapp/app
      run: >-
        python manage.py test
        app.tests.test_e2e_login
        app.tests.test_e2e_index
        app.tests.test_e2e_index_mobile
        app.tests.test_e2e_theme
        app.tests.test_e2e_menu
        app.tests.test_e2e_menu_mobile
        app.tests.test_e2e_tabs
        app.tests.test_e2e_input_filter
        app.tests.test_e2e_cl_includes
        app.tests.test_e2e_layout
        app.tests.test_e2e_csp
        app.tests.test_e2e_ai_image
